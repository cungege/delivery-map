<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3组配送路线规划 - 高德地图</title>
  <style>
    html,body,#map{height:100%;margin:0;padding:0;}
    .legend {
      position: absolute; top: 20px; left: 20px; background: white; padding: 12px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); z-index: 999; font-size: 14px; line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 图例 -->
  <div class="legend">
    <strong>3组配送路线</strong><br>
    <span style="color:#FF0000;">● 组1（红色）</span><br>
    <span style="color:#00FF00;">● 组2（绿色）</span><br>
    <span style="color:#0000FF;">● 组3（蓝色）</span>
  </div>

  <!-- 高德JS API -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=b5280cf1a14f4dea11bb03e25e1b72b9&plugin=AMap.Driving"></script>
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'd1696b36a67c28cdee2466920e4bacac'
    };

    const map = new AMap.Map('map', {
      zoom: 10,                                      // 初始缩放（广西区域合适）
      center: [109.561199, 23.103332]                // 直接设为3组共同起点（广西）
    });

    // 3组路线数据（你的真实经纬度）
    const routes = [
      { name: "组1", start: [109.561199,23.103332], end: [110.190964,23.583378], color: "#FF0000" },
      { name: "组2", start: [109.561199,23.103332], end: [109.74654,22.76897],   color: "#00FF00" },
      { name: "组3", start: [109.561199,23.103332], end: [110.365833,23.292222], color: "#0000FF" }
    ];

    let completed = 0;   // 计数器：等所有路线加载完后统一适应视图

    routes.forEach(route => {
      new AMap.Driving({
        map: map,
        policy: AMap.DrivingPolicy.LEAST_TIME,
        hideMarkers: false,
        autoFitView: false   // 关闭单个自动fit，统一在最后处理
      }).search(route.start, route.end, (status, result) => {
        if (status === 'complete' && result.routes.length) {
          const path = result.routes[0].steps.flatMap(step => step.path);
          const polyline = new AMap.Polyline({
            path: path,
            strokeColor: route.color,
            strokeWeight: 8,
            strokeOpacity: 0.85,
            lineJoin: 'round'
          });
          map.add(polyline);

          // 起点终点标记
          new AMap.Marker({ position: route.start, map: map, title: route.name + ' 起点' });
          new AMap.Marker({ position: route.end, map: map, title: route.name + ' 终点' });

          completed++;
          // 所有路线加载完成 → 自动缩放到完整显示3条路线
          if (completed === routes.length) {
            map.setFitView();   // 关键！统一适应全部路线
          }
        }
      });
    });
  </script>
</body>
</html>
