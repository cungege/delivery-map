<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>智能配送路线规划 - 高德地图</title>
  <style>
    html,body,#map{height:100%;margin:0;padding:0;font-family:Microsoft Yahei,sans-serif;}
    .container {display:flex;height:100%;}
    .sidebar {width:340px;background:#fff;border-right:1px solid #ddd;padding:15px;overflow:auto;}
    button {padding:12px 20px;background:#67c23a;color:white;border:none;border-radius:6px;cursor:pointer;font-size:16px;width:100%;}
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h3>智能配送规划</h3>
      <button onclick="getDataFromJiandaoyun()">📡 获取简道云路线</button>
      <div id="resultInfo" style="margin-top:15px;font-size:13px;"></div>
    </div>
    <div class="map-container">
      <div id="map"></div>
      <div class="info" id="status">等待规划...</div>
    </div>
  </div>

  <script src="https://webapi.amap.com/maps?v=2.0&key=b5280cf1a14f4dea11bb03e25e1b72b9&plugin=AMap.Driving,AMap.Geocoder"></script>
  <script>
    let map, startPoint = null, startAddress = '', destinations = [];
    const MAX_DRIVING_TIME = 6480;
    const STOP_TIME_PER_SITE = 10800;

    function initMap() {
      map = new AMap.Map('map', { zoom: 11, center: [109.561199, 23.103332] });
    }

    async function getDataFromJiandaoyun() {
      document.getElementById('status').innerHTML = '正在从简道云获取数据...';
      document.getElementById('resultInfo').innerHTML = '';

      // ==================== 请修改下面两行 ====================
      const VERCEL_PROXY_URL = "https://jiandaoyun-proxy.vercel.app/api/proxy";   // ←←← 改成你 Vercel 的地址
      const APP_ID = "69f2edba8bb15d99bb09b8f9";        // ←←← 改成你的
      const ENTRY_ID = "6a1e7c78a4d82f8092fc53a6";    // ←←← 改成你的
      // =====================================================

      try {
        const response = await fetch(VERCEL_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            app_id: APP_ID,
            entry_id: ENTRY_ID
          })
        });

        const result = await response.json();
        console.log("简道云返回数据:", result);

        // 解析 addr1 ~ addr8
        destinations = [];
        if (result.data && result.data.length > 0) {
          const record = result.data[0];
          for (let i = 1; i <= 8; i++) {
            const field = record[`addr${i}`];
            if (field && field.value && field.value.trim() !== '') {
              const address = field.value.trim();
              const lnglat = await getLngLat(address);
              if (lnglat) {
                destinations.push({ lnglat: lnglat, address: address });
              }
            }
          }
        }

        if (destinations.length > 0) {
          startPoint = new AMap.LngLat(109.561199, 23.103332);
          startAddress = "起点";
          await planBatches();
        } else {
          document.getElementById('status').innerHTML = '未找到有效地址';
        }
      } catch (error) {
        console.error(error);
        document.getElementById('status').innerHTML = '调用失败';
      }
    }

    async function getLngLat(str) {
      return new Promise(resolve => {
        if (str.includes(',')) {
          const [lng, lat] = str.split(',').map(Number);
          resolve(new AMap.LngLat(lng, lat));
        } else {
          const geocoder = new AMap.Geocoder();
          geocoder.getLocation(str, (status, result) => {
            if (status === 'complete' && result.geocodes.length) {
              resolve(result.geocodes[0].location);
            } else {
              resolve(null);
            }
          });
        }
      });
    }

    // 以下规划逻辑保持不变（已包含你要求的分批规则）
    async function planBatches() { /* ... */ }
    async function calculateDrivingTime(start, points) { /* ... */ }
    async function planOneBatch(start, points, batchIndex) { /* ... */ }
    function getBatchColor(index) { /* ... */ }
    function showAllBatches(routes) { /* ... */ }

    window.onload = function() {
      initMap();
    };
  </script>
</body>
</html>
