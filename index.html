<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>智能配送路线规划 - 高德地图</title>
  <style>
    html,body,#map{height:100%;margin:0;padding:0;font-family:Microsoft Yahei,sans-serif;}
    .container {display:flex;height:100%;}
    .sidebar {width:340px;background:#fff;border-right:1px solid #ddd;padding:15px;overflow:auto;}
    .map-container {flex:1;position:relative;}
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h3>智能配送规划</h3>
      <div id="resultInfo" style="margin-top:15px;font-size:13px;"></div>
    </div>
    <div class="map-container">
      <div id="map"></div>
      <div class="info" id="status">正在加载路线...</div>
    </div>
  </div>

  <script src="https://webapi.amap.com/maps?v=2.0&key=b5280cf1a14f4dea11bb03e25e1b72b9&plugin=AMap.Driving,AMap.Geocoder"></script>
  <script>
    let map;

    function initMap() {
      map = new AMap.Map('map', { zoom: 11, center: [109.561199, 23.103332] });
    }

    // 从 URL 参数获取数据并自动规划
    async function loadFromUrlParams() {
      const params = new URLSearchParams(window.location.search);
      
      const startStr = params.get('start');
      const destParams = [];

      // 获取所有 dest1, dest2, dest3 ... 参数
      for (let i = 1; ; i++) {
        const dest = params.get(`dest${i}`);
        if (!dest) break;
        destParams.push(dest);
      }

      if (!startStr || destParams.length === 0) {
        document.getElementById('status').innerHTML = '参数错误，请检查URL';
        return;
      }

      // 解析起点和目的地
      const startPoint = await getLngLat(startStr);
      const destinations = [];
      for (let dest of destParams) {
        const lnglat = await getLngLat(dest);
        if (lnglat) destinations.push({lnglat, address: dest});
      }

      if (!startPoint || destinations.length === 0) {
        document.getElementById('status').innerHTML = '地址解析失败';
        return;
      }

      // 开始自动规划
      await autoPlanRoute(startPoint, destinations);
    }

    // 后续自动规划逻辑（与之前相同）
    async function autoPlanRoute(startPoint, destinations) {
      // ...（这里可以复用你之前规划路线的代码）
      document.getElementById('status').innerHTML = `已收到 ${destinations.length} 个目的地，正在规划路线...`;
      // 调用你之前的 planBatches 函数
    }

    async function getLngLat(str) {
      // 复用你之前的地址解析函数
      return new Promise(resolve => {
        if (str.includes(',')) {
          const [lng, lat] = str.split(',').map(Number);
          resolve(new AMap.LngLat(lng, lat));
        } else {
          const geocoder = new AMap.Geocoder();
          geocoder.getLocation(str, (status, result) => {
            if (status === 'complete' && result.geocodes.length) {
              resolve(result.geocodes[0].location);
            } else {
              resolve(null);
            }
          });
        }
      });
    }

    window.onload = function() {
      initMap();
      loadFromUrlParams();   // 自动读取URL参数
    };
  </script>
</body>
</html>
