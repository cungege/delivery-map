<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>智能配送路线规划 - 高德地图</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Microsoft Yahei, sans-serif;
    }
    
    .container {
      display: flex;
      height: 100vh;
      width: 100%;
    }
    
    .sidebar {
      width: 340px;
      background: #fff;
      border-right: 1px solid #ddd;
      padding: 15px;
      overflow: auto;
      flex-shrink: 0;
    }
    
    .map-container {
      flex: 1;
      position: relative;
      height: 100%;
      min-height: 0;
    }
    
    #map {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    button {
      padding: 12px 20px;
      background: #67c23a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
      margin-top: 8px;
    }
    
    .route-batch {
      margin-bottom: 12px;
      padding: 8px;
      background: #f8f9fa;
      border-radius: 6px;
      border-left: 4px solid #67c23a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h3>智能配送规划</h3>
      <button onclick="getDataFromJiandaoyun()">📡 获取简道云路线</button>
      
      <!-- 新增车队GPS监控按钮 -->
      <button onclick="startFleetMonitoring()" style="background:#409eff;">🚚 开始车队GPS监控</button>
      <button onclick="stopFleetMonitoring()" style="background:#f56c6c;">⏹ 停止监控</button>

      <div id="resultInfo" style="margin-top:15px;font-size:13px;"></div>
    </div>
    <div class="map-container">
      <div id="map"></div>
      <div class="info" id="status">等待规划...</div>
    </div>
  </div>

  <!-- 高德安全配置 -->
  <script>
    window._AMapSecurityConfig = {
      securityJsCode: 'd1696b36a67c28cdee2466920e4bacac'
    }
  </script>
  
  <script src="https://webapi.amap.com/maps?v=2.0&key=b5280cf1a14f4dea11bb03e25e1b72b9&plugin=AMap.Driving,AMap.Geocoder"></script>

  <script>
    // ==================== 全局变量（只声明一次） ====================
    let map, startPoint = null, startAddress = '', destinations = [], allRoutes = [];
    let monitoringInterval = null;
    let vehicleMarkers = [];
    let currentPlannedBatchIds = [];
    const MAX_DRIVING_TIME = 6480;
    const STOP_TIME_PER_SITE = 10800;

    // 生成唯一 batch_id
    function generateUniqueBatchId() {
      return 'batch_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
    }

    function initMap() {
      const mapContainer = document.getElementById('map');
      
      if (!mapContainer) {
        console.error('地图容器不存在');
        document.getElementById('status').innerHTML = '地图容器加载失败';
        return;
      }

      if (typeof AMap === 'undefined') {
        console.error('AMap 未加载');
        document.getElementById('status').innerHTML = '高德地图加载失败';
        return;
      }

      try {
        map = new AMap.Map('map', {
          zoom: 11,
          center: [109.561199, 23.103332],
          resizeEnable: true,
          viewMode: '2D'
        });

        setTimeout(() => {
          if (map) {
            map.resize();
            console.log('✅ 地图初始化并 resize 完成');
            document.getElementById('status').innerHTML = '地图加载成功';
          }
        }, 400);

      } catch (e) {
        console.error('地图初始化异常:', e);
        document.getElementById('status').innerHTML = '地图初始化失败';
      }
    }

    // ==================== 获取简道云数据 + 规划 ====================
    async function getDataFromJiandaoyun() {
      document.getElementById('status').innerHTML = '正在从简道云获取数据...';
      document.getElementById('resultInfo').innerHTML = '';

      const VERCEL_PROXY_URL = "https://jiandaoyun-proxy.vercel.app/api/proxy";
      const APP_ID = "69f2edba8bb15d99bb09b8f9";
      const ENTRY_ID = "6a1e7c78a4d82f8092fc53a6";

      try {
        const response = await fetch(VERCEL_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ app_id: APP_ID, entry_id: ENTRY_ID })
        });

        const result = await response.json();
        console.log("简道云返回完整数据:", result);

        if (!result.data || result.data.length === 0) {
          document.getElementById('status').innerHTML = '简道云未返回数据';
          return;
        }

        const record = result.data[0];
        destinations = [];

        for (let i = 1; i <= 8; i++) {
          const coordStr = record[`addr${i}`];
          if (coordStr && coordStr.trim() !== '') {
            const lnglat = await getLngLat(coordStr);
            if (lnglat) destinations.push({ lnglat, address: coordStr });
          }
        }

        if (destinations.length === 0) {
          document.getElementById('status').innerHTML = '未解析到有效地址';
          return;
        }

        startPoint = new AMap.LngLat(109.561199, 23.103332);
        startAddress = "起点";

        await planBatches();
        await writePlanResultToJiandaoyun();

      } catch (error) {
        console.error(error);
        document.getElementById('status').innerHTML = '调用失败';
      }
    }

    async function getLngLat(str) {
      return new Promise(resolve => {
        if (str.includes(',')) {
          const [lng, lat] = str.split(',').map(Number);
          resolve(new AMap.LngLat(lng, lat));
        }
      });
    }

    async function planBatches() {
      allRoutes = [];
      let batch = [], batchIndex = 1;

      for (let i = 0; i < destinations.length; i++) {
        const tempBatch = [...batch, destinations[i]];
        const drivingTime = await calculateDrivingTime(startPoint, tempBatch);

        if ((drivingTime > MAX_DRIVING_TIME || tempBatch.length > 2) && batch.length > 0) {
          const route = await planOneBatch(startPoint, batch, batchIndex);
          allRoutes.push(route);
          batchIndex++;
          batch = [destinations[i]];
        } else {
          batch = tempBatch;
        }
      }

      if (batch.length > 0) {
        const route = await planOneBatch(startPoint, batch, batchIndex);
        allRoutes.push(route);
      }

      showAllBatches(allRoutes);
    }

    async function calculateDrivingTime(start, points) {
      return new Promise(resolve => {
        const driving = new AMap.Driving({ policy: AMap.DrivingPolicy.LEAST_TIME });
        const waypoints = points.map(p => p.lnglat);
        driving.search(start, waypoints[waypoints.length-1], { waypoints: waypoints.slice(0,-1) }, (status, result) => {
          resolve(status === 'complete' && result.routes.length ? result.routes[0].time : 999999);
        });
      });
    }

    async function planOneBatch(start, points, batchIndex) {
      return new Promise(resolve => {
        const driving = new AMap.Driving({ policy: AMap.DrivingPolicy.LEAST_TIME, hideMarkers: true });
        const waypoints = points.map(p => p.lnglat);

        driving.search(start, waypoints[waypoints.length-1], { waypoints: waypoints.slice(0,-1) }, (status, result) => {
          if (status === 'complete' && result.routes.length) {
            const route = result.routes[0];
            const path = route.steps.flatMap(step => step.path || []);

            new AMap.Polyline({
              map: map,
              path: path,
              strokeColor: getBatchColor(batchIndex),
              strokeWeight: 8,
              strokeOpacity: 0.9
            });

            new AMap.Marker({
              position: start,
              map: map,
              icon: new AMap.Icon({ image: 'https://webapi.amap.com/theme/v1.3/markers/n/start.png', size: new AMap.Size(30, 45) }),
              label: { content: startAddress, direction: 'top', offset: new AMap.Pixel(0, -50) }
            });

            points.forEach(p => {
              new AMap.Marker({
                position: p.lnglat,
                map: map,
                icon: new AMap.Icon({ image: 'https://webapi.amap.com/theme/v1.3/markers/n/end.png', size: new AMap.Size(30, 45) }),
                label: { content: p.address, direction: 'right', offset: new AMap.Pixel(15, 0) }
              });
            });

            resolve({
              batchIndex,
              time: route.time,
              distance: route.distance,
              points: points
            });
          }
        });
      });
    }

    function getBatchColor(index) {
      const colors = ['#FF0000', '#00FF00', '#0000FF', '#FF00FF', '#00FFFF'];
      return colors[(index-1) % colors.length];
    }

    function showAllBatches(routes) {
      let html = `<h4>规划结果（共 ${routes.length} 批次）</h4>`;
      routes.forEach(r => {
        const drivingHours = (r.time / 3600).toFixed(1);
        const stopHours = (r.points.length * 3).toFixed(1);
        html += `
          <div class="route-batch">
            <strong>第${r.batchIndex}批次</strong>：${r.points.length}个目的地<br>
            行驶时间：${drivingHours}小时 | 停留：${stopHours}小时<br>
            目的地：${r.points.map(p => p.address).join(' → ')}
          </div>`;
      });
      document.getElementById('resultInfo').innerHTML = html;
      document.getElementById('status').innerHTML = '✅ 规划完成！';
    }

    // ==================== 回写（使用随机唯一ID作为batch_id） ====================
    async function writePlanResultToJiandaoyun() {
      const VERCEL_PROXY_URL = "https://jiandaoyun-proxy.vercel.app/api/proxy";
      const WRITE_APP_ID = "69f2edba8bb15d99bb09b8f9";
      const WRITE_ENTRY_ID = "6a1e7b26851b5f657059e81f";

      const writeList = [];
      const batchUniqueIds = [];

      for (let route of allRoutes) {
        const dest1 = route.points[0] ? route.points[0].address : "";
        const dest2 = route.points[1] ? route.points[1].address : "";
        const totalTime = (route.time + route.points.length * STOP_TIME_PER_SITE) / 3600;

        const uniqueId = generateUniqueBatchId();
        batchUniqueIds.push(uniqueId);

        writeList.push({
          app_id: WRITE_APP_ID,
          entry_id: WRITE_ENTRY_ID,
          data: {
            "date": { "value": new Date().toISOString() },
            "batch_id": { "value": uniqueId },
            "status": { "value": "待出发" },
            "team_leader": { "value": "" },
            "start_addr": { "value": "109.561199,23.103332" },
            "target_addr1": { "value": dest1 },
            "target_addr2": { "value": dest2 },
            "total_time": { "value": parseFloat(totalTime.toFixed(1)) },
            "total_dest": { "value": parseFloat((route.distance / 1000).toFixed(1)) },
            "gps_sub_table": { "value": [] }
          }
        });
      }

      try {
        const res = await fetch(VERCEL_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            action: "save_plan",
            data_list: writeList
          })
        });

        const result = await res.json();
        currentPlannedBatchIds = [...batchUniqueIds];

        alert(`成功回写 ${writeList.length} 个批次！已生成唯一ID用于监控`);
      } catch (err) {
        console.error(err);
        alert("回写简道云失败");
      }
    }

    // ==================== 只监控本次规划的批次 ====================
    function clearVehicleMarkers() {
      vehicleMarkers.forEach(m => m.setMap(null));
      vehicleMarkers = [];
    }

    async function fetchFleetPositions() {
  console.log("【调试】fetchFleetPositions 函数开始执行");

  if (currentPlannedBatchIds.length === 0) {
    console.log("【调试】currentPlannedBatchIds 为空，提前返回");
    document.getElementById('status').innerHTML = '没有本次规划的批次可监控';
    return;
  }

  console.log("【调试】currentPlannedBatchIds 内容:", currentPlannedBatchIds);

  const VERCEL_PROXY_URL = "https://jiandaoyun-proxy.vercel.app/api/proxy";
  const BATCH_APP_ID = "69f2edba8bb15d99bb09b8f9";
  const BATCH_ENTRY_ID = "6a1e7b26851b5f657059e81f";

  try {
    const response = await fetch(VERCEL_PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        app_id: BATCH_APP_ID,
        entry_id: BATCH_ENTRY_ID,
        limit: 100
      })
    });

    const result = await response.json();
    console.log("【调试】从简道云获取到的总批次数量:", result.data ? result.data.length : 0);

    if (!result.data) {
      console.log("【调试】result.data 为空");
      return;
    }

    clearVehicleMarkers();

    const targetBatches = result.data.filter(record => {
      const batchIdValue = record.batch_id && record.batch_id.value;
      const isMatch = currentPlannedBatchIds.includes(batchIdValue);
      if (isMatch) {
        console.log("【调试】匹配成功，批次ID:", batchIdValue);
      }
      return isMatch;
    });

    console.log("【调试】筛选后符合条件的批次数量:", targetBatches.length);

    targetBatches.forEach((record, index) => {
      const gpsList = record.gps_sub_table || [];
      console.log(`【调试】第 ${index + 1} 个批次 GPS 数量:`, gpsList.length);

      if (gpsList.length === 0) {
        console.log(`【调试】第 ${index + 1} 个批次没有 GPS 数据，跳过`);
        return;
      }

      const latest = gpsList[gpsList.length - 1];
      console.log(`【调试】第 ${index + 1} 个批次 latest 数据:`, latest);

      const lng = parseFloat(latest.gps_lng);
      const lat = parseFloat(latest.gps_lat);

      console.log(`【调试】第 ${index + 1} 个批次 解析后的坐标:`, { lng, lat });

      if (!lng || !lat || isNaN(lng) || isNaN(lat)) {
        console.warn(`【调试】第 ${index + 1} 个批次 坐标无效，跳过`);
        return;
      }

      const leaderName = record.team_leader && record.team_leader.value 
        ? record.team_leader.value 
        : `批次${record.batch_id?.value || ''}`;

      const markerContent = `
        <div style="background:white;padding:4px 10px;border-radius:16px;box-shadow:0 2px 6px rgba(0,0,0,0.3);font-size:13px;display:flex;align-items:center;white-space:nowrap;">
          <span style="margin-right:6px;">🚚</span>
          <span>${leaderName}</span>
        </div>
      `;

      const marker = new AMap.Marker({
        position: new AMap.LngLat(lng, lat),
        map: map,
        content: markerContent,
        offset: new AMap.Pixel(-25, -18)
      });

      vehicleMarkers.push(marker);
      console.log(`【调试】成功创建第 ${index + 1} 个车辆标记`);
    });

    document.getElementById('status').innerHTML = 
      `监控中（${targetBatches.length} 个批次）${new Date().toLocaleTimeString()}`;

    console.log("【调试】本次 fetchFleetPositions 执行完毕");

  } catch (error) {
    console.error("【调试】fetchFleetPositions 发生错误:", error);
  }
}
    function startFleetMonitoring() {
      if (currentPlannedBatchIds.length === 0) {
        alert('请先规划路线并回写后再启动监控');
        return;
      }
      if (monitoringInterval) return;

      fetchFleetPositions();
      monitoringInterval = setInterval(fetchFleetPositions, 30000);
      document.getElementById('status').innerHTML = '车队GPS监控已启动（仅监控本次规划批次）';
    }

    function stopFleetMonitoring() {
      if (monitoringInterval) {
        clearInterval(monitoringInterval);
        monitoringInterval = null;
      }
      clearVehicleMarkers();
      document.getElementById('status').innerHTML = '车队监控已停止';
    }

    window.onload = function() {
      initMap();
    };
  </script>
</body>
</html>
